onboarding = false
[ui]
copy_on_select = false
agent_panel_sort = "spaces"
status_indicators = "symbols"

show_agent_labels_on_pane_borders = true
[terminal]
new_cwd = "~/Documents/REPOS"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = true

[keys]
prefix = "ctrl+a"

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "state_text", "workspace", "tab"], ["agent"]]

[theme.custom]
red = "#D55E00"
green = "#0072B2"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "gh dash"
width = "95%"
height = "95%"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "file viewer (split)"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-navigator.open"
description = "navigator"
